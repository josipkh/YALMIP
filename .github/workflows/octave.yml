name: Complete integration test (Octave)

on:
  push:
    # branches: [ develop ]
  pull_request:
    # branches: [ develop ]
  workflow_dispatch:

jobs:
  job1:
    name: Complete integration (basics)
    runs-on: ubuntu-latest
    
    permissions:
      checks: write
      contents: write
      pull-requests: write
      statuses: write      
    
    steps:
      - uses: actions/checkout@v4
      
      # Upgraded checkouts to v4 for modern Node.js support in runners
      - name: Checkout tools repo
        uses: actions/checkout@v4
        with:
          repository: sqlp/sedumi
          path: sedumi
          
      - name: Confirm
        run: ls -l
            
      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave octave-dev libopenblas-dev octave-junit-xml

      - name: Build SeDuMi
        run: |
          octave --eval "cd('sedumi'); install_sedumi -rebuild;"
          
      - name: Test core
        run: |
          # Overwrite runxunittests.m dynamically with an Octave-compatible runner
          cat << 'EOF' > runxunittests.m
          function results = runxunittests(whichtest, xmlFile)
              pkg load junit-xml;
              
              if nargin < 2
                  [~, name] = fileparts(whichtest);
                  xmlFile = [name '.xml'];
              end
              
              % Initialize a JUnit test suite object
              suite = junit_testsuite(whichtest);
              
              % Find all .m test files in the specified directory
              testFiles = glob(get_absolute_path([whichtest '/*.m']));
              all_passed = true;
              
              for i = 1:length(testFiles)
                  [~, filename] = fileparts(testFiles{i});
                  case_obj = junit_testcase(filename, whichtest);
                  
                  try
                      % Run Octave's native internal test system on the file
                      [passed, total] = test(testFiles{i}, 'quiet');
                      if passed < total || total == 0
                          error("Some tests failed or no tests found.");
                      end
                      case_obj.set_success();
                  catch
                      err = latch();
                      case_obj.set_failure(err.message, "TestFailed");
                      all_passed = false;
                  end
                  suite.add_testcase(case_obj);
              end
              
              % Write the report out for dorny/test-reporter
              suite.write_xml(xmlFile);
              
              % Return a dummy object with assertSuccess method to satisfy original workflow
              results.all_passed = all_passed;
              if ~all_passed
                  error("Test suite execution failed.");
              end
          end
          function path = get_absolute_path(p); path = canonicalize_file_name(p); end
          EOF

          octave --eval "addpath(genpath(pwd)); warning('off'); runxunittests('dev/tests/core');"

      - name: Test operators
        if: success() || failure() 
        run: |
          octave --eval "addpath(genpath(pwd)); warning('off'); results = runxunittests('dev/tests/operators');"
          
      - name: Test misc
        if: success() || failure()       
        run: |
          octave --eval "addpath(genpath(pwd)); warning('off'); results = runxunittests('dev/tests/misc');"

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Report (basics)
          path: '*.xml'
          reporter: java-junit
          fail-on-error: 'false'             

